<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets env(safe-area-inset-*) report real values. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pantry Logic helps your household keep a shared grocery list, track what's in stock, and decide what to eat.">

  <!-- Browser / Android status bar colour matches the in-app status-bar band
       and the "I'm Hungry" button (AppPalette.primary). -->
  <meta name="theme-color" content="#2D5A27" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#7FB87A" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pantry Logic">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>Pantry Logic</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      The app draws edge to edge, under the black-translucent iOS status
      bar. Page background matches the app background for the current
      scheme (AppColors.background / backgroundDm) so there is no flash
      before Flutter paints.
    */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: #F7F7F4;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #1A1C1A; }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading img {
      width: 96px;
      height: auto;
    }
    /* Resolves env(safe-area-inset-*) to px for pantryLogicSafeArea(). */
    #safe-area-probe {
      position: fixed;
      top: 0;
      left: 0;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
  </style>
  <script>
    // Flutter web reports zero safe-area padding, so the app reads the
    // device insets from here (lib/core/web_safe_area.dart) and feeds them
    // into MediaQuery. Returns [top, right, bottom, left] in CSS px.
    window.pantryLogicSafeArea = function () {
      var probe = document.getElementById('safe-area-probe');
      if (!probe) return [0, 0, 0, 0];
      var s = getComputedStyle(probe);
      return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft]
        .map(function (v) { return parseFloat(v) || 0; });
    };
  </script>
</head>
<body>
  <div id="safe-area-probe"></div>
  <div id="loading"><img src="icons/Icon-192.png" alt="Pantry Logic"></div>
  <!--
    flutter_bootstrap.js is customised in web/flutter_bootstrap.js to remove
    the loading logo once the engine is up.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
